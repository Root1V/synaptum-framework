[project]
name = "synaptum"
version = "1.0.0rc1"
description = "Provider-agnostic agent framework and durable runtime. Owns execution semantics; the harness owns the substrate."
keywords = ["agents", "llm", "durable-execution", "agent-framework", "provider-agnostic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Emeric Espiritu Santiago", email = "emericespiritusantiago@gmail.com" }]

# RM-30 — cero dependencias duras. El núcleo es stdlib puro.
dependencies = []

[project.optional-dependencies]
pydantic  = ["pydantic>=2"]
anthropic = ["anthropic>=1"]
openai    = ["openai>=2"]
mcp       = ["mcp>=1"]
otel      = ["opentelemetry-sdk>=1.30"]
# Fijado al rc a propósito: aún no hay versión estable, y un '>=1' sin permitir
# prelanzamientos no resuelve. Se relaja cuando salga 1.0.0.
#
# El mínimo es rc3 y no rc1: desde rc3 el SDK trae sus URLs por defecto, así que
# el puente no necesita configuración de direcciones. Con rc1 resolvería igual y
# fallaría al construir el cliente pidiendo dos URLs — un mínimo que resuelve y
# no funciona es peor que uno que no resuelve.
axonium   = ["axonium>=1.0.0rc3"]

# SYN-17 — los proveedores se descubren por entry point, sin que el núcleo los conozca.
[project.entry-points."synaptum.providers"]

[project.entry-points."synaptum.checkpointers"]

[dependency-groups]
dev = [
    "markdown-it-py>=3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synaptum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[project.urls]
Homepage = "https://github.com/Root1V/synaptum-framework"
Repository = "https://github.com/Root1V/synaptum-framework"
Changelog = "https://github.com/Root1V/synaptum-framework/blob/main/CHANGELOG.md"
Issues = "https://github.com/Root1V/synaptum-framework/issues"

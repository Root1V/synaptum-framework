# SYN-74 · Publicación por Trusted Publishing (OIDC).
#
# No hay token en ninguna parte: GitHub firma una identidad efímera y el índice
# la verifica. El secreto no está mejor guardado — no existe, así que no se
# puede filtrar, ni caducar sin avisar, ni acabar en el historial de un chat.
#
# Lo que hay que configurar en el índice (una vez, en «Publishing»):
#
#     owner       Root1V
#     repository  synaptum-framework
#     workflow    release.yml
#     environment testpypi   (o pypi)
#
# El `environment` no es decorativo, y ya no es solo una posibilidad:
#
#     pypi       exige **aprobación manual** de @Root1V antes de publicar.
#     testpypi   sin puerta: es el índice de ensayo, y pedir un clic por cada
#                ensayo acabaría con los ensayos.
#
# La puerta está en GitHub y no en quien lanza el workflow. Un permiso que
# depende de acordarse de preguntar no es un control: es una costumbre. Así el
# run se puede disparar desde cualquier sitio —o por un agente— y lo que sale a
# un índice público sigue necesitando que una persona lo mire.
#
# Se configura en Settings → Environments → pypi → Required reviewers, o por
# API. Y el `environment` es además lo que hace que el publisher de Trusted
# Publishing no valga para cualquier workflow del repositorio.
name: release

on:
  workflow_dispatch:
    inputs:
      index:
        description: Dónde publicar
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  # No se publica lo que no pasa. Reutiliza el workflow de tests en vez de
  # copiarlo: dos suites que se copian divergen, y la que diverge es siempre la
  # que guarda la puerta.
  tests:
    uses: ./.github/workflows/tests.yml

  # Publicar en PyPI exige haber ensayado en TestPyPI **esa misma versión**.
  #
  # Antes era una nota que decía «usa primero el índice de pruebas», y una
  # disciplina que depende de que alguien se acuerde no es un control: es una
  # intención. Axonium se saltó su propio ensayo y publicó un rc roto; nosotros
  # teníamos el mismo agujero y ninguna excusa, porque el suyo ya había pasado.
  #
  # No comprueba que la versión *esté subida* a TestPyPI, sino que sea
  # **instalable** desde allí. Subirla y que no instale es justo el fallo que el
  # ensayo existe para encontrar.
  ensayo:
    if: inputs.index == 'pypi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: esta versión se ensayó en TestPyPI
        run: |
          VERSION=$(python -c "
          import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          ")
          echo "comprobando que synaptum==$VERSION instala desde TestPyPI"
          # Sin `--extra-index-url`: uv mira los índices extra **antes** que el
          # principal, así que en cuanto synaptum existió en PyPI, pedir una
          # versión que solo está en TestPyPI fallaba con «no existe» en vez de
          # buscarla donde se le dijo. Y no hace falta ninguno más: el paquete
          # no tiene dependencias de ejecución.
          # `--refresh-package` por lo mismo que en `verify`: sin él, una
          # consulta anterior cacheada puede contestar por el índice.
          if ! uv run --isolated --no-project \
                --index-url https://test.pypi.org/simple/ \
                --refresh-package synaptum \
                --with "synaptum==$VERSION" python -c "import synaptum" ; then
            echo "::error::synaptum==$VERSION no se puede instalar desde TestPyPI."
            echo "Publica primero ahí: Run workflow → index=testpypi."
            exit 1
          fi

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - run: uv build --out-dir dist

      # Que el artefacto diga la misma versión que el código. Son dos sitios y
      # se editan a mano; un wheel publicado como una versión y que por dentro
      # dice otra manda a quien depure al sitio equivocado, y no falla nunca.
      - name: la versión del artefacto es la del código
        run: |
          VERSION=$(uv run python -c "import synaptum; print(synaptum.__version__)")
          ls dist/synaptum-${VERSION}-py3-none-any.whl dist/synaptum-${VERSION}.tar.gz
          echo "publicando $VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # `always()` porque `ensayo` se salta cuando el índice es testpypi, y un job
    # saltado bloquea a quien lo necesita si no se dice lo contrario. Lo que no
    # se tolera es que haya fallado.
    needs: [build, ensayo]
    if: always() && needs.build.result == 'success' && needs.ensayo.result != 'failure' 
    runs-on: ubuntu-latest
    environment: ${{ inputs.index }}
    permissions:
      id-token: write        # lo único que hace falta: acuñar el token OIDC
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: >-
            ${{ inputs.index == 'pypi'
                && 'https://upload.pypi.org/legacy/'
                || 'https://test.pypi.org/legacy/' }}

  # Instalar desde el índice y ejecutar ESA copia. Un tag no es una release
  # hasta que alguien puede instalarlo: Axonium publicó un rc cuyo CI estaba en
  # verde y al que le faltaban seis exportaciones, porque sus tests importaban
  # del submódulo interno y ningún consumidor hace eso.
  verify:
    needs: publish
    # `always()` por lo mismo que en `publish`, y esto no es cosmético: sin
    # ello GitHub **salta** este job. La regla propaga el salto de `ensayo`
    # por toda la cadena, aunque `publish` haya corrido y haya ido bien.
    #
    # Es el fallo de siempre: el job que comprueba que la publicación sirve
    # dejó de ejecutarse el día que se añadió `ensayo`, la publicación siguió
    # saliendo en verde, y lo único que se perdió es la comprobación. Un
    # instrumento que no mira nada no da error: da OK.
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    env:
      # En una sola línea y como variable de entorno: una expresión de GitHub
      # partida en varias líneas dentro de un `run` es legal y difícil de leer,
      # y esto se lee en un incidente.
      INDEX: ${{ inputs.index == 'pypi' && 'https://pypi.org/simple/' || 'https://test.pypi.org/simple/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: leer la versión que se acaba de publicar
        run: |
          echo "VERSION=$(python -c "
          import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          ")" >> "$GITHUB_ENV"

      # Un índice tarda en servir lo que acaba de aceptar, así que esto
      # reintenta. Y durante tres releases **el reintento no reintentaba**:
      #
      #     cache-control: max-age=600, public      ← lo que manda el índice
      #
      # `uv` respeta el caché HTTP, así que el primer intento guardaba «no
      # existe esa versión» y los siguientes releían esa respuesta. El bucle
      # parecía estar preguntando y estaba releyendo. Medido en el run de la
      # `rc4`: «verificado tras 12 intento(s)», y entre el primero y el que pasó
      # hay **10 min 37 s** — el `max-age` caducando, no el índice despertando.
      #
      # Encaja con todo el historial: o acertaba al primer intento (caché vacía)
      # o no acertaba ninguno. Nunca se recuperó en un reintento.
      #
      # `--refresh-package` es el arreglo: obliga a volver a preguntar. Sin él,
      # ampliar la ventana solo hacía esperar a que el caché caducara — que es
      # lo que hicimos antes y pasó por suerte, no por estar bien.
      #
      # Con el reintento arreglado la ventana vuelve a ser corta: **cinco
      # minutos**, diez intentos con el intervalo creciendo de 5s a 30s.
      # La espera y la comprobación son **el mismo paso** a propósito: una sonda
      # aparte puede decir que sí por un motivo que no es el índice —lo hizo, en
      # local, mirando el entorno en vez del índice— y entonces la verificación
      # arranca creyendo que hay algo. Si la instalación funciona, está servido.
      - name: instalar desde el índice y usarlo como un consumidor
        run: |
          espera=5
          for intento in $(seq 1 10); do
            if uv run --isolated --no-project --index-url "$INDEX" \
                 --refresh-package synaptum \
                 --with "synaptum==$VERSION" python "$GITHUB_WORKSPACE/.github/humo.py"; then
              echo "verificado tras ${intento} intento(s)"
              exit 0
            fi
            echo "intento ${intento}: el índice todavía no lo sirve (siguiente en ${espera}s)"
            sleep "$espera"
            [ "$espera" -lt 30 ] && espera=$((espera * 2))
          done
          echo "::error::synaptum==$VERSION no se pudo instalar desde $INDEX en cinco minutos."
          echo "OJO: esto NO significa que la publicación fallara. El paso anterior la subió;"
          echo "lo que no se ha podido confirmar es que el índice la sirva. Comprueba a mano"
          echo "antes de concluir nada, y si instala, lo que falló fue esta comprobación:"
          echo "  uv run --isolated --no-project --refresh --index-url $INDEX \\"
          echo "    --with synaptum==$VERSION python .github/humo.py"
          exit 1

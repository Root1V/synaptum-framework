[project]
name = "mi-agente"
version = "0.1.0"
description = "Un agente construido con Synaptum"
requires-python = ">=3.13"
dependencies = ["synaptum>=1.0.0rc2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mi_agente"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
